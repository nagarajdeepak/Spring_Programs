applserver:
  port: 8082

spring:
  application:
    name: Employee-Service-T2
    
  datasource:
    # Database "employeeservicet2" is created automatically if it does not exist.
    url: jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/employeeservicet2?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD:root}
    driver-class-name: com.mysql.cj.jdbc.Driver
  jpa:
    hibernate:
      ddl-auto: update   # creates/updates the "employees" table automatically
    show-sql: true
    properties:
      hibernate:
        format_sql: true

# Base URL of the Department-Service (inter-service call)
department-service:
  url: ${DEPARTMENT_SERVICE_URL:http://localhost:8081}
