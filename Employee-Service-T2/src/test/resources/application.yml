# Used only by automated tests: in-memory H2, so no MySQL is needed to run `mvn test`.
spring:
  application:
    name: Employee-Service-T2
  datasource:
    url: jdbc:h2:mem:employeeservicet2;MODE=MySQL;DB_CLOSE_DELAY=-1
    username: sa
    password:
    driver-class-name: org.h2.Driver
  jpa:
    hibernate:
      ddl-auto: create-drop

department-service:
  url: http://localhost:8081
