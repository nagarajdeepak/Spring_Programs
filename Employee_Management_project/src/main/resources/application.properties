spring.application.name=employee-management-project

# ==============================
# H2 in-memory database
# ==============================
spring.datasource.url=jdbc:h2:mem:employeemanagementproject
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=root
spring.datasource.password=root

spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

server.port=8080

# ==============================
# HikariCP connection pool
# ==============================
spring.datasource.hikari.pool-name=EmployeeHikariPool
spring.datasource.hikari.minimum-idle=5
spring.datasource.hikari.maximum-pool-size=20
spring.datasource.hikari.idle-timeout=30000
spring.datasource.hikari.max-lifetime=1800000
spring.datasource.hikari.connection-timeout=20000
spring.datasource.hikari.auto-commit=true

# ==============================
# Springdoc / Swagger UI
# ==============================
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.operationsSorter=method
springdoc.swagger-ui.tagsSorter=alpha

# ==============================
# Actuator
# ==============================
management.endpoints.web.exposure.include=health,info,metrics,env,beans
management.endpoint.health.show-details=always
management.info.env.enabled=true

info.app.name=Employee Management System
info.app.description=Spring Boot CRUD project for managing employees
info.app.version=1.0.0

# ==============================
# Logging
# ==============================
logging.level.root=INFO
logging.level.com.example.employee=DEBUG
logging.level.org.hibernate.SQL=DEBUG
logging.pattern.console=%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{36} - %msg%n

# ==============================
# Default pagination settings
# ==============================
app.pagination.default-page=0
app.pagination.default-size=10
app.pagination.max-size=100
