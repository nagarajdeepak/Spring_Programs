server:
  port: 8081

spring:
  application:
    name: Department-Service-T2
  datasource:
    # Database "departmentservicet2" is created automatically if it does not exist.
    url: jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/departmentservicet2?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD:root}
    driver-class-name: com.mysql.cj.jdbc.Driver
  jpa:
    hibernate:
      ddl-auto: update   # creates/updates the "departments" table automatically
    show-sql: true
    properties:
      hibernate:
        format_sql: true
