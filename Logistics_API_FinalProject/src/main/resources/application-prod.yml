spring:
  datasource:
    url: ${DB_URL:jdbc:mysql://localhost:3306/Logisticsdb}
    username: ${DB_USERNAME:logistics_user}
    password: ${DB_PASSWORD:}
    driver-class-name: com.mysql.cj.jdbc.Driver
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    database-platform: org.hibernate.dialect.MySQLDialect

management:
  endpoint:
    health:
      show-details: never

logging:
  level:
    root: WARN
    com.example.logistics: INFO