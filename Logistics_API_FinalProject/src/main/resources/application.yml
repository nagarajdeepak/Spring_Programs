spring:

  application:
    name: logistics-api

  profiles:
    active: dev

  jackson:
    default-property-inclusion: non_null
    datatype:
      datetime:
        write-dates-as-timestamps: false

  servlet:
    multipart:
      enabled: true
      max-file-size: 10MB
      max-request-size: 10MB

  web:
    error:
      include-message: never

server:
  port: 8080

app:
  file-storage:
    upload-dir: uploads
    max-file-size: 10485760

    allowed-content-types:
      - application/pdf
      - image/png
      - image/jpeg
      - image/jpg
      - application/msword
      - application/vnd.openxmlformats-officedocument.wordprocessingml.document

    allowed-extensions:
      - .pdf
      - .png
      - .jpg
      - .jpeg
      - .doc
      - .docx

springdoc:
  swagger-ui:
    path: /swagger-ui.html
    operationsSorter: method

  api-docs:
    path: /v3/api-docs

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics

  endpoint:
    health:
      show-details: when-authorized

logging:
  level:
    root: INFO
    com.example.logistics: DEBUG
    org.springframework.web: INFO